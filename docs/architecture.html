<h1>Booksmith</h1>
<p class="lede">Generated by <code>tools/architecture.py</code> from the pipeline in
<code>booksmith/</code>. Every agent it draws is checked against a real module, so it
cannot drift away from the code.</p>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" role="img" aria-label="How the Booksmith agents interact" font-family="Georgia, 'Times New Roman', serif">
<rect width="1440" height="1010" fill="#fdfbf7"/>
<text x="60" y="72" font-size="34" font-weight="bold" fill="#0f3d3e">How the agents interact</text>
<text x="60" y="104" font-size="15" fill="#5c6a6a">Agents never call each other. Each one reads the shared ledger, writes its own artefacts into it, and returns a decision.</text>
<text x="60" y="128" font-size="15" fill="#5c6a6a">The Orchestrator owns the routing, the review budget and the stop condition - that is the only place collaboration is decided.</text>
<rect x="60" y="140" width="198" height="34" rx="8" fill="#0f3d3e" fill-opacity="0.06" stroke="#0f3d3e" stroke-opacity="0.25"/>

<text x="76 + 106" y="162" font-size="11" fill="#5c6a6a">title + introduction + source links</text>

<text x="76 + 114" y="206" font-size="11" fill="#5c6a6a">run.py --title ... --urls ...</text>
<defs><marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#12707a"/></marker></defs>

<text x="84" y="816" font-size="13.5" font-weight="700" fill="#0f3d3e">A number can only reach the prose by travelling from a page, through a regex, into a claim, into a sentence that carries its citation.</text>
<text x="84" y="836" font-size="12" fill="#5c6a6a">The FactChecker repeats the whole journey after the chapter is written, so a figure cannot drift away from its source either.</text>
